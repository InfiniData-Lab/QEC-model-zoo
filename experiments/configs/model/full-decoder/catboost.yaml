model: CatBoost
hyperparameters: # HP search spaces taken from Tabzilla https://github.com/naszilla/tabzilla/blob/main/TabZilla/models/tree_models.py
    learning_rate:
        default: 0.01
        value_type: float
        log_scale: true
        range:
        - 0.01
        - 0.3
    max_depth:
        default: 2
        value_type: int
        log_scale: true
        range:
        - 2
        - 12
    l2_leaf_reg:
        default: 2.0
        value_type: float
        log_scale: true
        range:
        - 0.5
        - 30
    epochs:
        default: 500
        value_type: ignore
