model: LightGBM
hyperparameters: # HP search spaces taken from Tabzilla https://github.com/naszilla/tabzilla/blob/main/TabZilla/models/tree_models.py
    num_leaves:
        default: 1024
        value_type: int
        log_scale: true
        range:
        - 2
        - 4096
    lambda_l1:
        default: 1.0
        value_type: float
        log_scale: true
        range:
        - 1e-8
        - 10.0
    lambda_l2:
        default: 1.0
        value_type: float
        log_scale: true
        range:
            - 1e-8
            - 10.0
        constraint:
            type: '>'
            other_param: lambda_l1
    learning_rate:
        default: 0.01
        value_type: float
        log_scale: true
        range:
        - 0.01
        - 0.3
    epochs:
        default: 500
        value_type: ignore
