      - recency_defect_tau10
      - win_trend_defect
      - win_late_any
      - temporal_defect_com
      - run_mean_defect
      - run_frac_solo
      - run_frac_long
    persistence:
      - persist_defect_run_rate
      - persist_defect_switch_rate
      - corr_lag1
      - corr_lag2
      - corr_tau
    absolute:
      - absolute_defect_count
  source_dataset:
    name: "Weight-four parity checks with silicon spin qubits"
