  source_dataset:
    name: 'Surface code data and analysis for "Architectural mechanisms of a universal fault-tolerant quantum computer"'
    url: "https://doi.org/10.5281/zenodo.15685795"
    license: "https://creativecommons.org/licenses/by/4.0/"
    publisher: "Zenodo"
  activities:
    - name: "Dataset Digging"
      type: "Quality Review"
      description: "Exploratory analysis of the raw neutral-atom surface-code memory data. Atom-loss (erasure) events and the reconstruction of the final readout round were identified."
      agents_and_tools:
        - type: agent
          name: "Research author (Human)"
          description: "Explored the data and identified the atom-loss events and the final-round reconstruction."
    - name: "Format Conversion"
      type: "Data Preprocessing"
      description: "First QEC-Lake step: the raw data was converted directly into the QEC-Lake standard schema, with code layout and stabilizers derived and detectors computed."
      agents_and_tools:
        - type: tool
          name: "Harvard neutral-atom ingestion pipeline"
          description: "Code that converts the data to the QEC-Lake schema, derives layout and stabilizers, and computes detectors."
    - name: "Table Structuring"
      type: "Data Preprocessing"
      description: "Tables split by distance and basis, with the Z basis used for modelling. One row per shot with engineered features, including erasure (soft) information. Target: logical error."
      agents_and_tools:
        - type: tool
          name: "Feature extraction pipeline"
          description: "Splits the tables by distance and basis and builds the per-shot features, including erasure information."
    - name: "Quality Verification"
      type: "Quality Review"
      description: "Dataset documentation and metadata generated and checked."
      agents_and_tools:
        - type: agent
          name: "Human Auditor (Research author)"
          description: "Reviewed the generated documentation and metadata. Reviewed every finding from the AI agents before any change was made."
        - type: tool
          name: "Automated Quality Review Agents"
          description: "(Claude Code, Anthropic, running Claude Opus 4.7, later Claude Opus 4.8): AI coding agents that checked the quality of the processing (for example the rows of the output tables) and read through the processing code to check its quality. They reported their findings to the research author, who decided on every fix."
    - name: "Pipeline Transformation"
      type: "Data Preprocessing"
      description: "Second QEC-Lake step: the tables were processed through the QEC-Lake pipeline, then split by hand into train/test sets for the Model Zoo. QEC-Lake was used in Activities 2 and 5 only."
      agents_and_tools:
        - type: tool
          name: "QEC-Lake data lake pipeline"
          description: "Built the round-level tables in the QEC-Lake format."
        - type: agent
          name: "Research author (Human)"
          description: "Made the train/test split for the Model Zoo."
