    publisher: "Zenodo"
  activities:
    - name: "Dataset Digging"
      type: "Quality Review"
      description: "Exploratory analysis of the repeated parity-check experiment data and the accompanying analysis code."
      agents_and_tools:
        - type: agent
          name: "Research author (Human)"
