    - name: "Pipeline Transformation"
      type: "Data Preprocessing"
      description: "QEC-Lake step: the per-shot tables were processed through the QEC-Lake pipeline, then split by hand into train/test sets for the Model Zoo. Activities 1–4 did not use QEC-Lake."
      agents_and_tools:
        - type: tool
          name: "QEC-Lake data lake pipeline"
          description: "Processed the tables into the QEC-Lake format."
        - type: agent
          name: "Research author (Human)"
          description: "Made the train/test split for the Model Zoo."
