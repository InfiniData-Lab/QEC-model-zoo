# Optional per-entry fields consumed by QEC_model_zoo/scripts/generate_croissant.py:
#   license: <URL>       # e.g. https://creativecommons.org/licenses/by/4.0/
#   license_note: <text> # e.g. attribution or data-use-agreement requirements
#   citation: <text>     # -> cr:citeAs, e.g. a paper reference
#   url: <URL>           # -> sc:url, e.g. a model/dataset card this entry documents
#   notes: [<text>, ...] # extra description sentences appended verbatim
#   live_note: <text>    # entries with no folder_path (on-the-fly/live datasets)
#                        # default to a note pointing at this repo's own stim
#                        # generation code; override when that default is wrong
#                        # (e.g. documenting a dataset this repo does not itself
#                        # generate, only references for provenance)
# Until `license` is set, generated Croissant files carry an explicit
# "not yet finalized, do not redistribute" note instead of a fabricated license URL.
1:
  dataset_name: DiCarlo
  url: "https://www.kaggle.com/datasets/infinidata/qec-model-zoo-data"
  citation: "@inproceedings{wang2026qecmodelzoo,\n  title={{QEC} Model Zoo: Democratizing {AI}-enhanced Quantum Error Correction},\n  author = {Wang, Yuandou and de Groot, Max and Patwardhan, Aadi and Geerts, Floris and Hai, Rihan},\n  booktitle={The Fortieth Annual Conference on Neural Information Processing Systems Evaluations and Datasets Track},\n  year = {2026},\n  note = {Accepted at NeurIPS 2026; to appear}\n}"
  license: "https://creativecommons.org/licenses/by-nc/4.0/"
  code_family: repetition code
  platform: superconducting
  distance: 3
  file_type: parquet
  source: dicarlo
  per_round: false
  folder_path: datasets/dicarlo_rep_d3
  target_col: log_error
  shot_column: global_shot_id
  n_rounds_column: num_rounds
  raw_round_column: round_id
  feature_sets: [ "temporal", "rates", "final", "code", "spatial", "soft", "lstm" ]
  raw_features: [ 'defect1', 'defect2' ]
  shot_features_sequence: ['final_defect1', 'final_defect2']
  feature_groups:
    "temporal": [
      "defect1_rolling_mean",
      "defect2_rolling_mean",
      "defect1_rolling_std",
      "defect2_rolling_std",
      "defect1_burst_length",
      "defect2_burst_length",
      "defect1_first_norm",
      "defect2_first_norm",
      "defect1_last_norm",
      "defect2_last_norm",
      "defect1_episodes",
      "defect2_episodes",
      "defect1_recency",
      "defect2_recency",
      "defect1_switch_rate",
      "defect2_switch_rate"
    ]
    "rates": [
      "total_defects",
      "max_defects",
      "defect_rate"
    ]
    "final": [
      "defect1_last_round",
      "defect2_last_round"
    ]
    "code": [
      "code_distance",
      "n_stabilizers",
      "num_rounds"
    ]
    "spatial": [
      "defect_centroid_row",
      "defect_centroid_col",
      "defect_spread_row",
      "defect_spread_col",
      "defect1_local_neigh_mean",
      "defect2_local_neigh_mean",
      "defect1_local_any",
      "defect2_local_any",
      "defect1_local_co",
      "defect2_local_co"
    ]
    "soft": [
      "leak_z1_mean",
      "leak_z1_std",
      "leak_z1_min",
      "leak_z1_max",
      "leak_z2_mean",
      "leak_z2_std",
      "leak_z2_min",
      "leak_z2_max"
    ]
    "lstm": [
      "lstm_encoding_000",
      "lstm_encoding_001",
      "lstm_encoding_002",
      "lstm_encoding_003",
      "lstm_encoding_004",
      "lstm_encoding_005",
      "lstm_encoding_006",
      "lstm_encoding_007",
      "lstm_encoding_008",
      "lstm_encoding_009",
      "lstm_encoding_010",
      "lstm_encoding_011",
      "lstm_encoding_012",
      "lstm_encoding_013",
      "lstm_encoding_014",
      "lstm_encoding_015",
      "lstm_encoding_016",
      "lstm_encoding_017",
      "lstm_encoding_018",
      "lstm_encoding_019",
      "lstm_encoding_020",
      "lstm_encoding_021",
      "lstm_encoding_022",
      "lstm_encoding_023",
    ]
  source_dataset:
    name: "Data underlying the publication: Improved error correction with leakage reduction units built into qubit measurement in a superconducting quantum processor"
    url: "https://www.doi.org/10.4121/902d7f9e-38bf-48a2-a2f7-52bbf7aeeedf"
    license: "https://creativecommons.org/licenses/by/4.0/"
    publisher: "4TU.ResearchData"
  activities:
    - name: "Dataset Digging"
      type: "Quality Review"
      description: "Exploratory data analysis and in-depth examination of the raw dataset structure and content."
      agents_and_tools:
        - type: agent
          name: "Research author (Human)"
          description: "Studied the raw data and experimental setup to plan the processing steps."
    - name: "QuTech Format Conversion"
      type: "Data Preprocessing"
      description: "Data formatting and conversion into standard QuTech representation using domain-specific codebase."
      agents_and_tools:
        - type: tool
          name: "QuTech code pipeline"
          description: "QuTech's domain-specific codebase, used to convert the raw data into the standard QuTech format."
    - name: "Table Structuring"
      type: "Data Preprocessing"
      description: "Extracting structured tabular representations from the processed dataset."
      agents_and_tools:
        - type: tool
          name: "Feature extraction pipeline"
          description: "Turned the converted data into structured per-shot tables."
    - name: "Quality Verification"
      type: "Quality Review"
      description: "Validation and quality control checks conducted jointly through manual inspection and automated agents."
      agents_and_tools:
        - type: agent
          name: "Human Auditor (Research author)"
          description: "Manually inspected the tables and reviewed the automated check results. Reviewed every finding from the AI agents before any change was made."
        - type: tool
          name: "Automated Quality Review Agents"
          description: "(Claude Code, Anthropic, running Claude Opus 4.7, later Claude Opus 4.8 and Claude Opus 5): AI coding agents that checked the quality of the processing (for example the rows of the output tables) and read through the processing code to check its quality. They reported their findings to the research author, who decided on every fix."
    - name: "Pipeline Transformation"
      type: "Data Preprocessing"
      description: "QEC-Lake step: the tables were run end to end through the QEC-Lake data lake pipeline, then custom manual transformations were applied. Activities 1–4 did not use QEC-Lake."
      agents_and_tools:
        - type: tool
          name: "QEC-Lake data lake pipeline"
          description: "Standardised the tables into the QEC-Lake format."
        - type: agent
          name: "Research author (Human)"
          description: "Applied the custom manual transformations after the pipeline."
