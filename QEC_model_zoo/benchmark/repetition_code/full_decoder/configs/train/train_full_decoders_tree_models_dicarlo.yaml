experiment_name: "train_full_decoders_tree_models_dicarlo"
dataset_id: 'datasets/croissant/01_dicarlo.json'
experiment_type: train
decoder_type: 'full-decoder'
random_seed: 42
tuning_config:
  max_trials: 500
  early_stopping: true
  patience: 30
  minimize_metric: lep
  tuning_method: tpe
decoder_configs:
  - params_path: "experiments/configs/model/full-decoder/catboost.yaml"
    params_save_path: "experiments/model_checkpoints/train_full_decoders_tree_models_dicarlo/catboost/params.yaml"
    checkpoint_save_path: "experiments/model_checkpoints/train_full_decoders_tree_models_dicarlo/catboost/checkpoint_best.cbm"
  - params_path: "experiments/configs/model/full-decoder/lightgbm.yaml"
    params_save_path: "experiments/model_checkpoints/train_full_decoders_tree_models_dicarlo/lightgbm/params.yaml"
    checkpoint_save_path: "experiments/model_checkpoints/train_full_decoders_tree_models_dicarlo/lightgbm/checkpoint_best.txt"
  - params_path: "experiments/configs/model/full-decoder/xgboost.yaml"
    params_save_path: "experiments/model_checkpoints/train_full_decoders_tree_models_dicarlo/xgboost/params.yaml"
    checkpoint_save_path: "experiments/model_checkpoints/train_full_decoders_tree_models_dicarlo/xgboost/checkpoint_best.json"
