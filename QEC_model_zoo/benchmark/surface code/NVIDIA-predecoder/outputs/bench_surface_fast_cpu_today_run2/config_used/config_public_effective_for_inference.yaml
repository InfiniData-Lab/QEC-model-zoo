#
# Surface-code inference config for the pretrained CNN "Model 1 / Fast"
# (nvidia/Ising-Decoder-SurfaceCode-1-Fast, receptive field R=9, predecoder_memory_v1).
#
# Loaded via PREDECODER_SAFETENSORS_CHECKPOINT. Like the other inference configs it carries
# no `test:` block (the validator rejects it); shot count is controlled at runtime by
# PREDECODER_INFERENCE_NUM_SAMPLES. The 25-parameter circuit-level noise model below makes
# the inference header print `noise_model=25p`, which analysis/predecoder_log_stats.py needs
# to parse the run.
model_id: 1
distance: 9
n_rounds: 9

validation_ler: false

workflow:
  task: inference

data:
  code_rotation: O1
  noise_model:
    p_prep_X: 0.002
    p_prep_Z: 0.002
    p_meas_X: 0.002
    p_meas_Z: 0.002
    p_idle_cnot_X: 0.001
    p_idle_cnot_Y: 0.001
    p_idle_cnot_Z: 0.001
    p_idle_spam_X: 0.001998
    p_idle_spam_Y: 0.001998
    p_idle_spam_Z: 0.001998
    p_cnot_IX: 0.0002
    p_cnot_IY: 0.0002
    p_cnot_IZ: 0.0002
    p_cnot_XI: 0.0002
    p_cnot_XX: 0.0002
    p_cnot_XY: 0.0002
    p_cnot_XZ: 0.0002
    p_cnot_YI: 0.0002
    p_cnot_YX: 0.0002
    p_cnot_YY: 0.0002
    p_cnot_YZ: 0.0002
    p_cnot_ZI: 0.0002
    p_cnot_ZX: 0.0002
    p_cnot_ZY: 0.0002
    p_cnot_ZZ: 0.0002
